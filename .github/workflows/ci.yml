# CI exists from day one deliberately. It does almost nothing yet -- that is the
# point: CI added at the end of a project never gets adopted. Language jobs are
# guarded so they no-op until their service exists.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build postgres image
        uses: docker/build-push-action@v6
        with:
          context: ./infra/postgres
          tags: travel-postgres:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The pinned apt versions must actually resolve, and both extensions must
      # load. This is the check that catches a silently-broken base image.
      - name: Assert extensions load
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci -e POSTGRES_USER=app \
            -e POSTGRES_DB=itinerary travel-postgres:ci
          for i in $(seq 1 60); do
            docker exec pg pg_isready -U app -d itinerary && break || sleep 2
          done
          docker exec pg psql -U app -d itinerary -tAc \
            "SELECT postgis_version(), (SELECT extversion FROM pg_extension WHERE extname='vector');"
          docker exec pg psql -U app -d itinerary -tAc \
            "SELECT pg_column_size(array_fill(0.1::real,ARRAY[768])::vector::halfvec) < 2000;" | grep -q t

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config -q
      - name: Assert .env.example covers every compose variable
        run: |
          # Every ${VAR} referenced in compose must be documented in .env.example
          # or have a default, or a fresh clone breaks in a confusing way.
          missing=0
          for v in $(grep -oE '\$\{[A-Z_]+' docker-compose.yml | tr -d '${' | sort -u); do
            grep -qE "^${v}=|\\\$\\{${v}:-" docker-compose.yml .env.example || { echo "undocumented: $v"; missing=1; }
          done
          exit $missing

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning scripts/*.sh

  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if ls services/*/go.mod >/dev/null 2>&1; then echo "present=true" >> $GITHUB_OUTPUT
          else echo "present=false" >> $GITHUB_OUTPUT; echo "no go modules yet (expected before M1)"; fi
      - uses: actions/setup-go@v5
        if: steps.check.outputs.present == 'true'
        with: { go-version: '1.25', cache-dependency-path: services/*/go.sum }
      - if: steps.check.outputs.present == 'true'
        run: |
          for d in services/*/; do
            [ -f "$d/go.mod" ] || continue
            (cd "$d" && go vet ./... && go build ./... && go test ./...)
          done

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ -f services/api-py/pyproject.toml ]; then echo "present=true" >> $GITHUB_OUTPUT
          else echo "present=false" >> $GITHUB_OUTPUT; echo "no python project yet (expected before M1)"; fi
      - uses: astral-sh/setup-uv@v5
        if: steps.check.outputs.present == 'true'
      - if: steps.check.outputs.present == 'true'
        working-directory: services/api-py
        run: uv sync --frozen && uv run ruff check . && uv run pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ -f apps/web/package.json ]; then echo "present=true" >> $GITHUB_OUTPUT
          else echo "present=false" >> $GITHUB_OUTPUT; echo "no web app yet (expected before M1)"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - if: steps.check.outputs.present == 'true'
        working-directory: apps/web
        run: npm ci && npm run lint && npm run typecheck && npm run build
