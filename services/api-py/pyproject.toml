[project]
name = "travel-api"
version = "0.1.0"
description = "Intent extraction, hybrid retrieval and itinerary optimisation"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "asyncpg>=0.30",
    "httpx>=0.28",
    "ortools>=9.11",
    "python-dateutil>=2.9",
    "structlog>=25.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "respx>=0.22", "ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
